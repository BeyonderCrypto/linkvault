[build]
  publish = "public"
  functions = "netlify/functions"

# Redirigir llamadas API a la función serverless de Netlify
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Redirigir el resto al frontend SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
